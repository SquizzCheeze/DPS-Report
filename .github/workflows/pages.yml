name: Publish the website

# docs/ is the exporter's download page, served by GitHub Pages at
# https://squizzcheeze.github.io/DPS-Report/ (Settings -> Pages -> Source is
# "GitHub Actions"). It goes live on any push that changes docs/, no tag
# needed; the Download button finds the newest release with the exe itself.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
